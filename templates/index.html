{% extends "base.html" %}

{% block title %}Resolve IQ — Redirecting{% endblock %}

{% block content %}

<div
    style="
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    "
>
    <div class="card" style="max-width: 520px; width: 100%;">

        <div
            style="
                width: 64px;
                height: 64px;
                margin: 0 auto 20px;
                border-radius: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(124, 92, 255, 0.15);
                color: var(--purple);
                font-size: 26px;
            "
        >
            <i class="fa-solid fa-brain"></i>
        </div>

        <h2 style="margin-bottom: 10px;">
            Resolve IQ
        </h2>

        <p style="color: var(--muted); margin-bottom: 24px;">
            The Resolve IQ workspace has moved to the new dashboard.
        </p>

        <a
            href="/dashboard"
            class="btn btn-primary"
        >
            <i class="fa-solid fa-gauge-high"></i>
            Open Dashboard
        </a>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    window.location.replace("/dashboard");
});
</script>

{% endblock %}
